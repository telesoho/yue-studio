[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yue-studio"
version = "0.1.0"
description = "Gradio studio for YuE2: scores, chords, covers, and model downloads"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "gradio>=5.0,<6",
    "yue2-infer",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.scripts]
yue-studio = "yue_studio.app:main"

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
default-groups = []

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
yue2-infer = { path = "../YuE", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
